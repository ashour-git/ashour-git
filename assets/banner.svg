<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Mohamed Ashour, AI Engineer</title>
  <desc id="d">A terminal window reading: whoami, Mohamed Ashour, AI Engineer, LLMs, NLP and computer vision. Beside it, a ray-traced black hole whose accretion disk bends over the event horizon.</desc>
  <style>
@media (prefers-reduced-motion: no-preference) {
  .tw{animation:tw 4.2s ease-in-out infinite}
  .tw2{animation:tw 6.4s ease-in-out infinite 1.3s}
  .tw3{animation:tw 5.1s ease-in-out infinite 2.6s}
  .cur{animation:blink 1.1s steps(1) infinite}
  .float{animation:float 9s ease-in-out infinite}
  .sig{animation:sig 3.6s linear infinite}
  .out{animation:pulse 3.6s ease-out infinite}
}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(0,-9px) rotate(-1.6deg)}}
@keyframes sig{0%{stroke-dashoffset:112}38%,100%{stroke-dashoffset:-12}}
@keyframes pulse{0%,72%{opacity:.35}82%{opacity:1}100%{opacity:.35}}

  text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  </style>
  <rect width="1200" height="400" fill="#0d1117"/>
  <image href="data:image/png;base64," width="1200" height="400" style="image-rendering:pixelated"/>
  <rect class="tw" x="1129" y="384" width="4" height="4" fill="#e6edf3"/>
  <rect class="tw2" x="726" y="29" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw3" x="671" y="27" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw" x="969" y="30" width="4" height="4" fill="#e6edf3"/>
  <rect class="tw2" x="942" y="37" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw3" x="607" y="352" width="4" height="4" fill="#e6edf3"/>
  <rect class="tw" x="655" y="28" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw2" x="1167" y="326" width="4" height="4" fill="#e6edf3"/>
  <g>
    <rect x="40" y="52" width="520" height="276" fill="#0d1117" stroke="#e6edf3" stroke-width="1.5"/>
    <line x1="40" y1="84" x2="560" y2="84" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="56" y="74" font-size="14" fill="#7d8590">ashour@event-horizon: ~</text>
    <rect x="494" y="62" width="12" height="12" fill="none" stroke="#e6edf3"/>
    <rect x="514" y="62" width="12" height="12" fill="none" stroke="#e6edf3"/>
    <rect x="534" y="62" width="12" height="12" fill="#e6edf3"/>
    <text x="72" y="126" font-size="21" fill="#7d8590"><tspan fill="#f0643c">$</tspan> whoami</text>
    <text x="72" y="188" font-size="52" font-weight="700" fill="#e6edf3" letter-spacing="-1">Mohamed Ashour</text>
    <text x="72" y="232" font-size="24" fill="#e6edf3">AI Engineer</text>
    <text x="72" y="264" font-size="19" fill="#7d8590">LLMs, NLP and computer vision</text>
    <text x="72" y="310" font-size="21" fill="#7d8590"><tspan fill="#f0643c">$</tspan></text>
    <rect class="cur" x="94" y="293" width="12" height="22" fill="#e6edf3"/>
  </g>
</svg>
