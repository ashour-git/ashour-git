<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Mohamed Ashour, AI Engineer</title>
  <desc id="d">A terminal window reading: whoami, Mohamed Ashour, AI Engineer building AI governance systems. Beside it, a dithered planet with city lights on its night side.</desc>
  <style>
@media (prefers-reduced-motion: no-preference) {
  .tw{animation:tw 4.2s ease-in-out infinite}
  .tw2{animation:tw 6.4s ease-in-out infinite 1.3s}
  .tw3{animation:tw 5.1s ease-in-out infinite 2.6s}
  .cur{animation:blink 1.1s steps(1) infinite}
  .float{animation:float 9s ease-in-out infinite}
}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(0,-9px) rotate(-1.6deg)}}

  text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  </style>
  <rect width="1200" height="400" fill="#0d1117"/>
  <image href="data:image/png;base64," width="1200" height="400" style="image-rendering:pixelated"/>
  <rect class="tw" x="857" y="45" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw2" x="793" y="80" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw3" x="814" y="114" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw" x="759" y="194" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw2" x="743" y="188" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw3" x="824" y="127" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw" x="1151" y="127" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw2" x="978" y="64" width="4" height="4" fill="#e6edf3"/>
  <rect class="tw3" x="1069" y="72" width="2" height="2" fill="#f0643c"/>
  <g>
    <rect x="40" y="52" width="640" height="276" fill="#0d1117" stroke="#e6edf3" stroke-width="1.5"/>
    <line x1="40" y1="84" x2="680" y2="84" stroke="#e6edf3" stroke-width="1.5"/>
    <text x="56" y="74" font-size="14" fill="#7d8590">ashour@orbit: ~</text>
    <rect x="614" y="62" width="12" height="12" fill="none" stroke="#e6edf3"/>
    <rect x="634" y="62" width="12" height="12" fill="none" stroke="#e6edf3"/>
    <rect x="654" y="62" width="12" height="12" fill="#e6edf3"/>
    <text x="72" y="126" font-size="21" fill="#7d8590"><tspan fill="#f0643c">$</tspan> whoami</text>
    <text x="72" y="188" font-size="52" font-weight="700" fill="#e6edf3" letter-spacing="-1">Mohamed Ashour</text>
    <text x="72" y="232" font-size="24" fill="#e6edf3">AI Engineer</text>
    <text x="72" y="264" font-size="19" fill="#7d8590">AI governance and compliance systems</text>
    <text x="72" y="310" font-size="21" fill="#7d8590"><tspan fill="#f0643c">$</tspan></text>
    <rect class="cur" x="94" y="293" width="12" height="22" fill="#e6edf3"/>
  </g>
</svg>
