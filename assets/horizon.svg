<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t">
  <title id="t">Earth rising over a dithered lunar horizon</title>
  <style>
@media (prefers-reduced-motion: no-preference) {
  .tw{animation:tw 4.2s ease-in-out infinite}
  .tw2{animation:tw 6.4s ease-in-out infinite 1.3s}
  .tw3{animation:tw 5.1s ease-in-out infinite 2.6s}
  .cur{animation:blink 1.1s steps(1) infinite}
  .float{animation:float 9s ease-in-out infinite}
}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(0,-9px) rotate(-1.6deg)}}
</style>
  <rect width="1200" height="220" fill="#0d1117"/>
  <image href="data:image/png;base64," width="1200" height="220" style="image-rendering:pixelated"/>
  <rect class="tw" x="386" y="56" width="4" height="4" fill="#e6edf3"/>
  <rect class="tw2" x="452" y="71" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw3" x="43" y="110" width="4" height="4" fill="#e6edf3"/>
  <rect class="tw" x="1134" y="73" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw2" x="809" y="99" width="4" height="4" fill="#e6edf3"/>
  <rect class="tw3" x="754" y="51" width="4" height="4" fill="#f0643c"/>
</svg>
