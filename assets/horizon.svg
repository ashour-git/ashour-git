<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t">
  <title id="t">Earth rising over a dithered lunar horizon, marked by a detection box labelled earth 0.97 and an image caption</title>
  <style>
@media (prefers-reduced-motion: no-preference) {
  .tw{animation:tw 4.2s ease-in-out infinite}
  .tw2{animation:tw 6.4s ease-in-out infinite 1.3s}
  .tw3{animation:tw 5.1s ease-in-out infinite 2.6s}
  .cur{animation:blink 1.1s steps(1) infinite}
  .float{animation:float 9s ease-in-out infinite}
  .sig{animation:sig 3.6s linear infinite}
  .out{animation:pulse 3.6s ease-out infinite}
}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(0,-9px) rotate(-1.6deg)}}
@keyframes sig{0%{stroke-dashoffset:112}38%,100%{stroke-dashoffset:-12}}
@keyframes pulse{0%,72%{opacity:.35}82%{opacity:1}100%{opacity:.35}}

  text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  </style>
  <rect width="1200" height="260" fill="#0d1117"/>
  <image href="data:image/png;base64," width="1200" height="260" style="image-rendering:pixelated"/>
  <rect class="tw" x="228" y="116" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw2" x="538" y="26" width="4" height="4" fill="#e6edf3"/>
  <rect class="tw3" x="620" y="36" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw" x="701" y="101" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw2" x="31" y="116" width="2" height="2" fill="#e6edf3"/>
  <rect class="tw3" x="1109" y="42" width="2" height="2" fill="#f0643c"/>
  <rect x="830" y="48" width="92" height="92" fill="none" stroke="#f0643c" stroke-width="2"/>
  <rect x="829" y="26" width="98" height="22" fill="#f0643c"/>
  <text x="836" y="42" font-size="14" font-weight="700" fill="#0d1117">earth 0.97</text>
  <rect x="24" y="216" width="394" height="28" fill="#0d1117" stroke="#30363d"/>
  <text x="36" y="235" font-size="14" fill="#e6edf3">caption: "earth rising over a lunar horizon"</text>
</svg>
